retry_delay_ms = 1000

[llm.models.output_comparison]
provider = "openrouter"
model_name = ""
max_completion_tokens = 20000
temperature = 0
top_p = 1
frequency_penalty = 0
presence_penalty = 0
reasoning_effort = "high"
max_retries = 1
retry_delay_ms = 1000

[llm.prompt_replacement]
role = "role_placeholder"

[[analysis_workflows]]
slug = "EPF-general-analysis-example"
model = "general_analysis"
runs = 1
output_filename = "general-analysis-example-[seed]-[model].epf.md"
prompt = """Count how many functions and classes are defined in the codebase. 
Provide a summary of the number of functions and classes, and list their names.
"""

[[analysis_workflows.input_files_searches]]
file_glob = "*.{cpp,h}"
search_directory = "."
excluded_files = []

[[testing_workflows]]
slug = "EPF-testing-example"
model = "general_analysis"
runs = 1
output_filename = "testing-example-[seed]-[model].epf.md"
setup_commands = []
cleanup_commands = []

[[testing_workflows.test_cases]]
name = "Test Case 1"
work_directory = "."
single_run_command = ""
interactive_steps = []

[testing_workflows.test_cases.single_run_expected_output]
prefix_strip_string = ""
postfix_strip_string = ""
substring = ""
llm_judge_input_mode = "NONE"
llm_judge_prompt = ""
