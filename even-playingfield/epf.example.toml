[llm.providers.google.headers]
[llm.models.general_analysis]
provider = "openrouter"
model_name = ""
max_completion_tokens = 20000
temperature = 0.9
top_p = 1
frequency_penalty = 0
presence_penalty = 0
reasoning_effort = "high"
